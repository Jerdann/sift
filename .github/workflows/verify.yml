name: Verify Sift without publishing

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        run: pnpm verify:release
      - name: Audit public source
        run: pnpm audit:public
      - name: Typecheck
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      - name: Verify production bundle budgets
        run: pnpm verify:performance
      - name: Run Electron end-to-end tests
        run: pnpm test:e2e
      - name: Build installer and update feed
        run: pnpm make
      - name: Verify packaged runtime
        run: pnpm verify:package
      - name: Smoke-test packaged runtime
        run: pnpm smoke:package
