name: Release Sift for Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata
        shell: pwsh
        env:
          SIFT_RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm verify:release

      - name: Audit public source
        run: pnpm audit:public

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run Electron end-to-end tests
        run: pnpm test:e2e

      - name: Build installer and update feed
        run: pnpm make

      - name: Verify packaged runtime
        run: pnpm verify:package

      - name: Smoke-test packaged runtime
        run: pnpm smoke:package

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath 'out/make/squirrel.windows/x64' -File | ForEach-Object FullName
          if ($assets.Count -lt 3) { throw 'Squirrel update artifacts are incomplete.' }
          gh release create $env:GITHUB_REF_NAME @assets --generate-notes --title "Sift $env:GITHUB_REF_NAME"
